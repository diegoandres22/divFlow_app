name: Deploy Vite App (frontend) to GitHub Pages

# DESACTIVADO: el hosting de producción de DivFlow va a ser Vercel (conectado
# directo al repo desde su propio dashboard), no GitHub Pages. Este workflow
# es residuo del template original y ya no debe dispararse solo con push a
# main para evitar publicar una versión fantasma del sitio en github.io.
# Queda solo activable a mano (Actions > Run workflow) hasta que se borre
# definitivamente en la limpieza de "código a eliminar".
on:
  workflow_dispatch: {}

permissions:
  contents: write  # allow deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend  # 👈 Run all commands inside frontend folder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist  # 👈 built folder inside frontend